<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/main.css">
    <title>Miaoutchi Game</title>
</head>

<body>
    <div id="board">
        <!-- Gradient blobs in bg-->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>

        <div id="arrow-container">
            <div class="static-arrow" id="arrow-left">
                <img class="arrow-icon" id="arrow-left-img" src="./img/icons/arrow-liquid-glass.svg" alt="arrow direction left">
            </div>
            <div class="static-arrow" id="arrow-up">
                <img class="arrow-icon" id="arrow-top-img" src="./img/icons/arrow-liquid-glass.svg" alt="arrow direction up">
            </div>
            <div class="static-arrow" id="arrow-down">
                <img class="arrow-icon" id="arrow-down-img" src="./img/icons/arrow-liquid-glass.svg" alt="arrow direction down">
            </div>
            <div class="static-arrow" id="arrow-right">
                <img class="arrow-icon" id="arrow-right-img" src="./img/icons/arrow-liquid-glass.svg" alt="arrow direction right">
            </div>
        </div>
        <div id="point-container">
            <div id="score"><span id="score-value">0</span></div>
        </div>

    </div>
    <script src="/js/main.js"></script>
</body>

</html>
